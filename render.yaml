# Render Blueprint for the Getmeds backend.
#
# Render reads this on "New > Blueprint" and provisions the service, the disk
# and the environment for you — the browser equivalent of the Oracle setup
# script, without the Linux administration.
#
# Two settings here are load-bearing and easy to get wrong by hand:
#
#   plan: starter    The free plan has NO persistent disk and spins down after
#                    15 minutes idle. Both are fatal here: the database is a
#                    file, and zohoAutoSyncService is a setInterval that dies
#                    with the process. $7/month buys a disk and a process that
#                    stays alive.
#
#   numInstances: 1  Not a cost decision. zohoAutoSyncService's overlap guard,
#                    the signup rate limiter and the salesperson cache are all
#                    in-memory and per-process. A second instance means two
#                    sync loops walking the same orders and double the Zoho API
#                    budget, with no guard between them.
services:
  - type: web
    name: getmeds-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: getmeds-backend
    numInstances: 1
    autoDeploy: true

    buildCommand: npm ci --omit=dev

    # Migrate on every boot rather than at build time: the disk is mounted at
    # runtime, not during the build, so a build-time migration would write to
    # ephemeral storage and be thrown away. migrate.js is idempotent — it adds
    # only what is missing — so running it each start is safe and means a
    # deploy can never come up against an un-migrated database.
    startCommand: npm run migrate && node server.js

    healthCheckPath: /api/health

    disk:
      name: getmeds-data
      # Mounted somewhere neutral and pointed at with GETMEDS_DB_DIR, rather
      # than mounted over the repo's own data/ directory. That variable exists
      # already (db/database.js honours it), and this way the mount path does
      # not depend on where Render happens to check the repo out.
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: GETMEDS_DB_DIR
        value: /var/data

      - key: ZOHO_MODE
        value: live
      - key: ZOHO_ORG_ID
        value: "714292728"
      - key: ZOHO_ALLOWED_ORG_IDS
        value: "714292728"
      - key: ZOHO_DRY_RUN
        value: "false"
      - key: ZOHO_API_BASE_URL
        value: https://www.zohoapis.com/inventory/v1
      - key: ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com

      - key: SIGNUP_ENABLED
        value: "true"
      - key: SIGNUP_ALLOWED_EMAIL_DOMAINS
        value: getmeds.ph

      # Exact-match allowlist. Set this to your Vercel production URL with no
      # trailing slash. Preview deployments get their own URLs and will be
      # refused unless added — intentional; a wildcard on a public API is what
      # we removed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # sync: false means "ask me in the dashboard, never store it in git".
      # Generate JWT_SECRET and ZOHO_WEBHOOK_SECRET fresh for production
      # rather than reusing the laptop's — a secret that has lived on a
      # development machine is a weaker secret. `npm run secrets:init` locally
      # will print a pair you can paste, or use any CSPRNG.
      - key: JWT_SECRET
        sync: false
      - key: ZOHO_WEBHOOK_SECRET
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
